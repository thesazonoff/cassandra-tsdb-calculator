.page-tab:focus-visible{outline:3px solid var(--citron);outline-offset:2px}
.ver{font-size:12px;font-weight:600;color:#273000;background:var(--lime);border-radius:999px;padding:2px 9px}
.frames{flex:1;position:relative;min-height:0}
.frames iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:var(--bg)}
@media (max-width:560px){.lead span.t{display:none}.page-tab{padding:7px 12px;font-size:13px}}
@media print{.bar{display:none}}
</style>

<script>
(function () {
  'use strict';
  const APP_VERSION = '2.1.0-rc.1';
  const PAGES = ['calc', 'fault'];
  const $ = id => document.getElementById(id);
  $('ver').textContent = APP_VERSION;
  // Адрес: #calc&s=... или #fault&s=...; расчёт каждой страницы хранится отдельно
  const st = { calc: '', fault: '' };
  let active = 'calc';
  (function parse() {
    const h = (location.hash || '').replace(/^#/, '');
    const m = /^(calc|fault)(?:&(.*))?$/.exec(h);
    if (m) { active = m[1]; st[active] = m[2] || ''; }
    else if (/(^|&)s=/.test(h)) st.calc = h;   // ссылки версии 2.0.x
  })();
  function writeUrl() {
    try { history.replaceState(null, '', '#' + active + (st[active] ? '&' + st[active] : '')); } catch (e) { }
  }
  window.__shell = {
    bridge(page) {
      return {
        get() { return st[page] ? '#' + st[page] : ''; },
        set(h) { st[page] = String(h || '').replace(/^#/, ''); if (page === active) writeUrl(); },
        url(h) { const s = h != null ? String(h).replace(/^#/, '') : st[page]; return location.href.split('#')[0] + '#' + page + (s ? '&' + s : ''); }
      };
    }
  };
  function decode(id) {
    const b = atob($(id).textContent.trim()), u = new Uint8Array(b.length);
    for (let i = 0; i < b.length; i++) u[i] = b.charCodeAt(i);
    return new TextDecoder().decode(u);
  }
  const loaded = {};
  function load(page) { if (loaded[page]) return; loaded[page] = true; $('frame-' + page).srcdoc = decode('src-' + page); }
  function show(page, focus) {
    active = page;
    PAGES.forEach(p => { const on = p === page; $('tab-' + p).setAttribute('aria-selected', on); $('tab-' + p).tabIndex = on ? 0 : -1; $('frame-' + p).hidden = !on; });
    load(page); writeUrl();
    if (focus) $('tab-' + page).focus();
  }
  PAGES.forEach(p => $('tab-' + p).addEventListener('click', () => show(p)));
  document.querySelector('.pages').addEventListener('keydown', e => {
    if (e.key !== 'ArrowRight' && e.key !== 'ArrowLeft') return;
    e.preventDefault(); show(PAGES[(PAGES.indexOf(active) + 1) % PAGES.length], true);
  });
  // Вставили другую ссылку в адресную строку той же вкладки: открыть расчёт заново
  window.addEventListener('hashchange', () => location.reload());
  show(active);
})();
</script>
