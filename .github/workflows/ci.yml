# Проверки на каждый push и pull request. Release вызывает этот же workflow перед публикацией.
name: CI

on:
  push:
    branches: [main, "release/**"]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}

jobs:
  app:
    name: Типы, unit, сборка, e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Проверка типов (tsc --checkJs)
        run: npm run typecheck
      - name: Unit-тесты и регрессия к 2.1.0
        run: npm run test:unit
      - name: Сборка одного HTML и бюджет размера
        run: npm run build
      - name: Браузер для e2e
        run: npx playwright install --with-deps chromium
      - name: Сквозные проверки в Chromium
        run: npm run test:e2e
        env:
          CI: "true"
      - uses: actions/upload-artifact@v7
        with:
          name: cassandra-tsdb-calculator-${{ github.sha }}
          path: dist/index.html
          retention-days: 14
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  model:
    name: Эталонная модель воспроизводится
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: sudo apt-get install -y --no-install-recommends liblz4-1
      - run: ./verification/run.sh model
