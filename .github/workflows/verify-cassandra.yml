# Проверка модели объёма на настоящей Apache Cassandra 5.0.9 (verification/run.sh).
# Запуск вручную: Actions → «Проверка на Cassandra 5.0.9» → Run workflow.
name: Проверка на Cassandra 5.0.9

on:
  workflow_dispatch:
    inputs:
      stage:
        description: "crossval: SSTable кода 5.0.9; server: запущенный сервер; all: обе"
        type: choice
        options: [all, crossval, server]
        default: all

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: sudo apt-get install -y --no-install-recommends liblz4-1
      - uses: actions/cache@v4
        with:
          path: verification/work/apache-cassandra-5.0.9-bin.tar.gz
          key: apache-cassandra-5.0.9-bin
      - name: crossval
        if: inputs.stage == 'all' || inputs.stage == 'crossval'
        run: ./verification/run.sh crossval
      - name: server
        if: inputs.stage == 'all' || inputs.stage == 'server'
        run: ./verification/run.sh server
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-results
          path: verification/results/
