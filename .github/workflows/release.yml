# Публикация релиза: Actions → Release → Run workflow → версия, например 2.0.1.
# Проверяет версию в index.html, ставит аннотированный тег vX.Y.Z, считает SHA-256
# и публикует релиз с заметками из docs/releases/vX.Y.Z.md.
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Версия без буквы v, например 2.0.1"
        required: true

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Проверить версию
        run: |
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            echo "::error::Версия должна быть в формате X.Y.Z"; exit 1
          fi
          grep -q "APP_VERSION = '$VERSION'" index.html || { echo "::error::В index.html другая версия"; exit 1; }
          grep -q "## \[$VERSION\]" CHANGELOG.md || { echo "::error::Нет раздела $VERSION в CHANGELOG.md"; exit 1; }
          test -f "docs/releases/v$VERSION.md" || { echo "::error::Нет заметок docs/releases/v$VERSION.md"; exit 1; }
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "::error::Тег v$VERSION уже существует"; exit 1
          fi

      - name: Собрать файлы релиза
        run: |
          mkdir -p dist
          cp index.html "dist/cassandra-tsdb-calculator-$VERSION.html"
          cd dist && sha256sum "cassandra-tsdb-calculator-$VERSION.html" > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Поставить аннотированный тег
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$VERSION" -m "Калькулятор TSDB Cassandra $VERSION"
          git push origin "v$VERSION"

      - name: Опубликовать релиз
        run: |
          gh release create "v$VERSION" \
            --verify-tag \
            --title "Калькулятор TSDB Cassandra $VERSION" \
            --notes-file "docs/releases/v$VERSION.md" \
            --latest \
            "dist/cassandra-tsdb-calculator-$VERSION.html#Калькулятор $VERSION (HTML)" \
            "dist/SHA256SUMS.txt#Контрольная сумма SHA-256"
